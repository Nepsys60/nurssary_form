<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EC"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <linearGradient id="woodBench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBB79F"/>
      <stop offset="100%" stop-color="#A89279"/>
    </linearGradient>
    <linearGradient id="kraftBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7B58A"/>
      <stop offset="40%" stop-color="#E5C79E"/>
      <stop offset="80%" stop-color="#D2AE81"/>
      <stop offset="100%" stop-color="#B89467"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BD5A36"/>
      <stop offset="60%" stop-color="#D96F48"/>
      <stop offset="100%" stop-color="#A54726"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2C2216" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background: Warm Nursery Workbench Scene -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Wooden Bench Planks -->
  <rect y="310" width="600" height="140" fill="url(#woodBench)"/>
  <line x1="0" y1="310" x2="600" y2="310" stroke="#8E7860" stroke-width="2"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#8E7860" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Background Soft Green Foliage -->
  <g opacity="0.35">
    <path d="M40 280 C60 210, 80 230, 110 260 C80 280, 50 290, 40 280 Z" fill="#2E6A3E"/>
    <path d="M15 250 C30 190, 60 210, 85 245 C55 260, 25 265, 15 250 Z" fill="#3D7D4D"/>
    <path d="M510 290 C530 200, 560 210, 580 260 C560 280, 530 295, 510 290 Z" fill="#2E6A3E"/>
    <path d="M470 270 C490 220, 520 230, 535 275 C510 285, 485 285, 470 270 Z" fill="#3D7D4D"/>
  </g>

  <!-- Terracotta Clay Saucer with Bone Meal Powder (Left) -->
  <g transform="translate(110, 315)">
    <ellipse cx="65" cy="50" rx="65" ry="20" fill="#2A1E15" opacity="0.25"/>
    <ellipse cx="65" cy="45" rx="60" ry="18" fill="url(#potGrad)"/>
    <ellipse cx="65" cy="42" rx="52" ry="14" fill="#E8DEC8"/>
    <!-- Powder mound -->
    <ellipse cx="65" cy="38" rx="42" ry="11" fill="#F4EEE1"/>
    <ellipse cx="63" cy="36" rx="30" ry="7" fill="#FCF9F2"/>
    <text x="65" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#6B533E" text-anchor="middle">Pure Steamed Powder</text>
  </g>

  <!-- Main Kraft Packaging Bag (Center) -->
  <g filter="url(#softShadow)" transform="translate(210, 85)">
    <!-- Bag Body -->
    <path d="M25 50 L155 50 L175 250 C175 262, 160 268, 90 268 C20 268, 5 262, 5 250 Z" fill="url(#kraftBag)"/>
    <!-- Fold details & stitch lines -->
    <path d="M25 50 L155 50 L150 25 L30 25 Z" fill="#C9A374" opacity="0.75"/>
    <line x1="25" y1="52" x2="155" y2="52" stroke="#8E6A3E" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="30" y1="26" x2="150" y2="26" stroke="#8E6A3E" stroke-width="1.5"/>

    <!-- Artisan Product Label -->
    <rect x="26" y="80" width="128" height="152" rx="4" fill="#FAF7F2" stroke="#D1C4B0" stroke-width="1"/>
    <rect x="30" y="84" width="120" height="144" rx="2" fill="none" stroke="#254730" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Label Content -->
    <text x="90" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#2E733D" letter-spacing="1.5" text-anchor="middle">KINNAU BOTANICAL</text>
    <line x1="50" y1="110" x2="130" y2="110" stroke="#C45B34" stroke-width="1"/>

    <text x="90" y="130" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1C2D20" text-anchor="middle">STEAMED</text>
    <text x="90" y="148" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1C2D20" text-anchor="middle">BONE MEAL</text>

    <!-- Nepali Script Subtitle -->
    <text x="90" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#6B533E" text-anchor="middle">स्टिम्ड बोन मिल मल</text>

    <!-- Specs Badge -->
    <rect x="38" y="174" width="104" height="20" rx="3" fill="#F1ECE0"/>
    <text x="90" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#C45B34" text-anchor="middle">PHOSPHORUS 22% · Ca 30%</text>

    <text x="90" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#4A564C" text-anchor="middle">Natural Bloom &amp; Root Stimulant</text>
    <text x="90" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#1C2D20" text-anchor="middle">1 KG NET WEIGHT</text>
  </g>

  <!-- Brass Trowel (Right) -->
  <g transform="translate(420, 290) rotate(18)">
    <path d="M0 0 L18 60 L6 62 L-10 10 Z" fill="#5A3E26"/>
    <path d="M16 55 L35 110 L15 115 L5 60 Z" fill="#D4AF37"/>
    <path d="M22 65 C35 85, 40 105, 30 112 C20 115, 12 95, 12 75 Z" fill="#C59B27"/>
  </g>
</svg>